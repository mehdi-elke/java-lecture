# Configuration des logs (java.util.logging), chargée au démarrage par Server.main.
# Utilisée à partir de la séance 3.

handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = ALL

# Une ligne par message : heure, niveau, classe, message
java.util.logging.SimpleFormatter.format = %1$tT %4$-7s [%3$s] %5$s%6$s%n

# Niveau des loggers du projet : INFO par défaut.
# Passez à FINE pour voir aussi les messages de niveau DEBUG (log.fine(...)).
.level = INFO
miniredis.level = INFO
